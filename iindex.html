<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VE Project 통합관리 대시보드</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #f8fafc; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* Toast Animation */
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    .toast-enter { animation: slideInRight 0.3s ease-out forwards; }
    .toast-exit { animation: fadeOut 0.3s ease-out forwards; }
  </style>
</head>
<body class="text-slate-800">

  <!-- Toast 알림 컨테이너 -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

  <div class="min-h-screen pb-12">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
      <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2 text-indigo-700">
          <i data-lucide="layout-dashboard" class="stroke-[2.5]"></i>
          <h1 class="text-xl font-bold tracking-tight">VE Project 관리</h1>
        </div>
        <nav class="flex gap-2" id="nav-tabs"></nav>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="max-w-7xl mx-auto px-6 py-8"></main>
  </div>

  <script>
    const initialProjects = [
      {
        id: 1, year: 2025, name: 'A-1 공구 도로건설공사 설계VE', client: '한국도로공사', period: '2025.01 ~ 2025.06', pm: '김수석', status: '완료',
        performance: { indexBefore: 500.00, indexAfter: 598.71, improvement: 19.74 },
        cost: { initialBefore: 77000.00, initialAfter: 76831.00, initialSave: 169.00, initialSaveRate: 0.22, lccBefore: 134622.32, lccAfter: 134446.83, lccSave: 175.49, lccSaveRate: 0.13 },
        value: { relativeLcc: 0.9987, valueIndexBefore: 500.00, valueIndexAfter: 599.49, valueImprovement: 19.90 }
      },
      {
        id: 2, year: 2024, name: 'B-지구 택지개발 조성공사 설계VE', client: 'LH 한국토지주택공사', period: '2024.03 ~ 2024.09', pm: '이책임', status: '진행중',
        performance: { indexBefore: 450, indexAfter: 520, improvement: 15.5 },
        cost: { initialBefore: 50000, initialAfter: 48000, initialSave: 2000, initialSaveRate: 4.0, lccBefore: 80000, lccAfter: 76000, lccSave: 4000, lccSaveRate: 5.0 },
        value: { relativeLcc: 0.95, valueIndexBefore: 450, valueIndexAfter: 540, valueImprovement: 20.0 }
      },
      {
        id: 3, year: 2023, name: 'C-스마트 물류센터 시공VE', client: '스마트물류(주)', period: '2023.08 ~ 2023.12', pm: '박소장', status: '완료',
        performance: { indexBefore: 300, indexAfter: 350, improvement: 16.6 },
        cost: { initialBefore: 20000, initialAfter: 18500, initialSave: 1500, initialSaveRate: 7.5, lccBefore: 35000, lccAfter: 32000, lccSave: 3000, lccSaveRate: 8.5 },
        value: { relativeLcc: 0.91, valueIndexBefore: 300, valueIndexAfter: 384, valueImprovement: 28.0 }
      }
    ];

    const initialIdeas = [
      { id: 1, projectId: 1, projectName: 'A-1 공구 도로건설공사 설계VE', category: '설계', facility: '기반시설', title: '외장재 변경을 통한 공사비 절감 및 미관 개선', discipline: '건축', initialSave: 50, lccSave: 80, type: '가치혁신형', isAdopted: true },
      { id: 2, projectId: 1, projectName: 'A-1 공구 도로건설공사 설계VE', category: '설계', facility: '기반시설', title: '흙막이 가시설 공법 변경', discipline: '토목', initialSave: 100, lccSave: 100, type: '비용절감형', isAdopted: true },
      { id: 3, projectId: 1, projectName: 'A-1 공구 도로건설공사 설계VE', category: '설계', facility: '기반시설', title: '고효율 펌프 도입', discipline: '기계', initialSave: -10, lccSave: 50, type: '성능강조형', isAdopted: false },
      { id: 4, projectId: 2, projectName: 'B-지구 택지개발 조성공사 설계VE', category: '실시', facility: '주거시설', title: 'LED 조명 디밍 시스템 적용', discipline: '전기', initialSave: 20, lccSave: 120, type: '성능향상형', isAdopted: true },
      { id: 5, projectId: 2, projectName: 'B-지구 택지개발 조성공사 설계VE', category: '실시', facility: '주거시설', title: '수목 규격 조정', discipline: '조경', initialSave: 30, lccSave: 30, type: '비용절감형', isAdopted: false },
      { id: 6, projectId: 3, projectName: 'C-스마트 물류센터 시공VE', category: '시공', facility: '물류시설', title: '배관 경로 최적화', discipline: '기계', initialSave: 150, lccSave: 150, type: '가치혁신형', isAdopted: true },
    ];

    // --- State ---
    const state = {
      activeTab: 'overall', 
      projects: [...initialProjects],
      ideas: [...initialIdeas],
      selectedProjectId: null,
      projectSortBy: 'latest',
      overallFilters: {
        category: '전체',
        facility: '전체',
        discipline: '전체',
        type: '전체',
        isAdopted: '전체'
      },
      chartInstances: {} 
    };

    const COLORS = {
      adopted: '#3b82f6', unadopted: '#f59e0b',
      types: ['#6366f1', '#10b981', '#f43f5e', '#eab308', '#0ea5e9', '#d946ef']
    };

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const bgColor = type === 'error' ? 'bg-rose-500' : 'bg-slate-800';
      toast.className = `toast-enter flex items-center gap-3 px-5 py-3 ${bgColor} text-white rounded-xl shadow-lg font-medium text-sm`;
      
      const icon = type === 'error' ? 'circle-x' : 'check-circle-2';
      toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i><span>${message}</span>`;
      
      container.appendChild(toast);
      lucide.createIcons({ root: toast });

      setTimeout(() => {
        toast.classList.replace('toast-enter', 'toast-exit');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      if (tabId !== 'project-detail') state.selectedProjectId = null;
      render();
    }

    function selectProject(id) {
      state.selectedProjectId = id;
      state.activeTab = 'project-detail';
      render();
    }

    function formatNumber(num) {
      if (isNaN(num)) return '0';
      return Number(num).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    // 전역 상태 업데이트 함수들
    window.updateProjectSort = (val) => { state.projectSortBy = val; render(); }
    window.updateOverallFilter = (key, val) => { state.overallFilters[key] = val; render(); }

    function destroyCharts() {
      for (const key in state.chartInstances) {
        if (state.chartInstances[key]) state.chartInstances[key].destroy();
      }
      state.chartInstances = {};
    }

    function drawCharts(targetIdeas) {
      if (targetIdeas.length === 0) return;

      const disciplineData = {};
      const typeData = {};
      let totalAdopted = 0;
      let totalUnadopted = 0;

      targetIdeas.forEach(idea => {
        if (!disciplineData[idea.discipline]) disciplineData[idea.discipline] = { adopted: 0, unadopted: 0 };
        if (idea.isAdopted) {
          disciplineData[idea.discipline].adopted++;
          totalAdopted++;
          typeData[idea.type] = (typeData[idea.type] || 0) + 1;
        } else {
          disciplineData[idea.discipline].unadopted++;
          totalUnadopted++;
        }
      });

      const labels = Object.keys(disciplineData);
      const adoptedData = labels.map(l => disciplineData[l].adopted);
      const unadoptedData = labels.map(l => disciplineData[l].unadopted);
      const typeLabels = Object.keys(typeData);
      const typeValues = Object.values(typeData);

      const commonOptions = { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } };

      const ctx1 = document.getElementById('chart-discipline-compare').getContext('2d');
      state.chartInstances['c1'] = new Chart(ctx1, {
        type: 'bar',
        data: { labels, datasets: [
            { label: '채택', data: adoptedData, backgroundColor: COLORS.adopted, borderRadius: 4 },
            { label: '미채택', data: unadoptedData, backgroundColor: COLORS.unadopted, borderRadius: 4 }
        ]},
        options: { ...commonOptions, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
      });

      const ctx2 = document.getElementById('chart-adoption-rate').getContext('2d');
      state.chartInstances['c2'] = new Chart(ctx2, {
        type: 'pie',
        data: { labels: ['채택', '미채택'], datasets: [{ data: [totalAdopted, totalUnadopted], backgroundColor: [COLORS.adopted, COLORS.unadopted], borderWidth: 2 }] },
        options: commonOptions
      });

      const ctx3 = document.getElementById('chart-discipline-adopted').getContext('2d');
      state.chartInstances['c3'] = new Chart(ctx3, {
        type: 'bar',
        data: { labels, datasets: [{ label: '채택 건수', data: adoptedData, backgroundColor: COLORS.adopted, borderRadius: 4 }] },
        options: { ...commonOptions, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { legend: { display: false } } }
      });

      const ctx4 = document.getElementById('chart-type-rate').getContext('2d');
      state.chartInstances['c4'] = new Chart(ctx4, {
        type: 'pie',
        data: {
          labels: typeLabels.length ? typeLabels : ['데이터 없음'],
          datasets: [{ data: typeValues.length ? typeValues : [1], backgroundColor: typeValues.length ? COLORS.types : ['#cbd5e1'], borderWidth: 2 }]
        },
        options: commonOptions
      });
    }

    function getChartsHTML() {
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-slate-800 mb-6 text-center">공종별 채택/미채택 비교</h3>
            <div class="h-64 relative"><canvas id="chart-discipline-compare"></canvas></div>
          </div>
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-slate-800 mb-6 text-center">제안 채택률</h3>
            <div class="h-64 relative"><canvas id="chart-adoption-rate"></canvas></div>
          </div>
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-slate-800 mb-6 text-center">공종별 채택 제안 개수</h3>
            <div class="h-64 relative"><canvas id="chart-discipline-adopted"></canvas></div>
          </div>
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-slate-800 mb-6 text-center">유형별 채택 비율 (채택건 기준)</h3>
            <div class="h-64 relative"><canvas id="chart-type-rate"></canvas></div>
          </div>
        </div>
      `;
    }

    function renderOverall() {
      const f = state.overallFilters;
      const filteredIdeas = state.ideas.filter(idea => {
        const matchCat = f.category === '전체' || idea.category === f.category;
        const matchFac = f.facility === '전체' || idea.facility === f.facility;
        const matchDis = f.discipline === '전체' || idea.discipline === f.discipline;
        const matchType = f.type === '전체' || idea.type === f.type;
        const adoptedStr = idea.isAdopted ? '채택' : '미채택';
        const matchAdopt = f.isAdopted === '전체' || adoptedStr === f.isAdopted;
        return matchCat && matchFac && matchDis && matchType && matchAdopt;
      });

      const totalInitialSave = filteredIdeas.reduce((sum, i) => sum + (Number(i.initialSave) || 0), 0);
      const totalLccSave = filteredIdeas.reduce((sum, i) => sum + (Number(i.lccSave) || 0), 0);
      const uniqueProjectsCount = new Set(filteredIdeas.map(i => i.projectName)).size;

      const makeSelect = (key, options, label) => `
        <div class="flex flex-col gap-1 w-full sm:w-auto">
          <label class="text-xs font-semibold text-slate-500 pl-1">${label}</label>
          <select onchange="updateOverallFilter('${key}', this.value)" class="bg-slate-50 border border-slate-200 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer min-w-[120px]">
            ${options.map(o => `<option value="${o}" ${state.overallFilters[key] === o ? 'selected' : ''}>${o}</option>`).join('')}
          </select>
        </div>
      `;

      let html = `
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-x-6 gap-y-4 items-end">
          <div class="flex items-center gap-2 mr-2 text-indigo-700 w-full sm:w-auto mb-2 sm:mb-0">
            <i data-lucide="filter" class="w-5 h-5"></i>
            <span class="font-bold whitespace-nowrap">통계 필터링</span>
          </div>
          ${makeSelect('category', ['전체', '기본설계', '실시설계', '실시', '설계', '시공'], '구분')}
          ${makeSelect('facility', ['전체', '의료시설', '운수시설', '문화 및 집회시설', '업무시설', '상업시설', '주거시설', '교육연구시설', '기반시설', '물류시설', '기타'], '시설구분')}
          ${makeSelect('discipline', ['전체', '건축', '토목', '기계', '전기', '통신', '소방', '조경'], '공종')}
          ${makeSelect('type', ['전체', '가치혁신형', '비용절감형', '성능강조형', '성능향상형'], '유형')}
          ${makeSelect('isAdopted', ['전체', '채택', '미채택'], '채택여부')}
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <p class="text-sm font-medium text-slate-500 mb-1">관련 프로젝트 수</p>
            <p class="text-3xl font-bold text-slate-800">${uniqueProjectsCount}건</p>
          </div>
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <p class="text-sm font-medium text-slate-500 mb-1">초기비용 절감액 합계</p>
            <p class="text-3xl font-bold text-emerald-600">${formatNumber(totalInitialSave)} <span class="text-base text-emerald-500/80">백만원</span></p>
          </div>
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <p class="text-sm font-medium text-slate-500 mb-1">LCC 절감액 합계</p>
            <p class="text-3xl font-bold text-emerald-600">${formatNumber(totalLccSave)} <span class="text-base text-emerald-500/80">백만원</span></p>
          </div>
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <p class="text-sm font-medium text-slate-500 mb-1">필터링된 아이디어</p>
            <p class="text-3xl font-bold text-indigo-600">${filteredIdeas.length}건</p>
          </div>
        </div>
      `;
      
      html += getChartsHTML();
      
      setTimeout(() => { drawCharts(filteredIdeas); }, 50);
      return html;
    }

    function renderProjects() {
      let sortedProjects = [...state.projects];
      if (state.projectSortBy === 'latest') sortedProjects.sort((a, b) => b.year - a.year);
      else if (state.projectSortBy === 'oldest') sortedProjects.sort((a, b) => a.year - b.year);
      else if (state.projectSortBy === 'name') sortedProjects.sort((a, b) => a.name.localeCompare(b.name));

      let cards = sortedProjects.map(proj => `
        <div onclick="selectProject(${proj.id})" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md hover:border-indigo-300 transition-all cursor-pointer group relative">
          <div class="absolute top-6 right-6 bg-slate-100 text-slate-600 text-sm font-bold px-3 py-1 rounded-full border border-slate-200 shadow-sm">
            ${proj.year}년
          </div>
          <div class="flex justify-between items-start mb-4 pr-16">
            <div>
              <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-full mb-3">${proj.status}</span>
              <h3 class="text-xl font-bold text-slate-800 group-hover:text-indigo-600 transition-colors">${proj.name}</h3>
              <p class="text-slate-500 text-sm mt-1">${proj.client}</p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 mt-6 pt-6 border-t border-slate-100">
            <div>
              <p class="text-xs text-slate-400 mb-1">LCC 절감액</p>
              <p class="font-bold text-emerald-600">${formatNumber(proj.cost.lccSave)} 백만원</p>
            </div>
            <div>
              <p class="text-xs text-slate-400 mb-1">가치 향상률</p>
              <p class="font-bold text-blue-600">▲ ${proj.value.valueImprovement}%</p>
            </div>
          </div>
        </div>
      `).join('');

      return `
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-slate-800">프로젝트 목록</h2>
          <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
            <i data-lucide="arrow-up-down" class="w-4 h-4 text-slate-500"></i>
            <select onchange="updateProjectSort(this.value)" class="text-sm font-medium text-slate-700 bg-transparent outline-none focus:ring-0 cursor-pointer">
              <option value="latest" ${state.projectSortBy === 'latest' ? 'selected' : ''}>최신 연도순</option>
              <option value="oldest" ${state.projectSortBy === 'oldest' ? 'selected' : ''}>과거 연도순</option>
              <option value="name" ${state.projectSortBy === 'name' ? 'selected' : ''}>가나다순</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">${cards}</div>
      `;
    }

    function renderProjectDetail() {
      const proj = state.projects.find(p => p.id === state.selectedProjectId);
      if(!proj) return '';

      let html = `
        <div class="flex items-center justify-between mb-8">
          <div>
            <button onclick="switchTab('projects')" class="text-slate-500 hover:text-indigo-600 text-sm font-medium mb-2 flex items-center gap-1">
              ← 목록으로 돌아가기
            </button>
            <h2 class="text-3xl font-bold text-slate-800">${proj.name} <span class="text-lg text-slate-400 ml-2 font-medium bg-slate-100 px-3 py-1 rounded-full border border-slate-200">${proj.year}년</span></h2>
          </div>
        </div>
        
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8">
          <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
            <h3 class="font-bold text-lg text-slate-800">원안 대비 가치분석 결과</h3>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
              <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-medium">
                <tr>
                  <th colspan="2" class="px-6 py-4 text-center border-r">구분</th>
                  <th class="px-6 py-4 text-right border-r">원안</th>
                  <th class="px-6 py-4 text-right">VE 종합</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                <tr>
                  <td rowspan="2" class="px-6 py-4 border-r font-medium text-slate-700 bg-slate-50/50 w-24 text-center">성능(P)</td>
                  <td class="px-6 py-4 border-r text-slate-600">성능 지수</td>
                  <td class="px-6 py-4 text-right border-r font-medium">${formatNumber(proj.performance.indexBefore)}</td>
                  <td class="px-6 py-4 text-right font-bold text-indigo-600">${formatNumber(proj.performance.indexAfter)}</td>
                </tr>
                <tr>
                  <td class="px-6 py-4 border-r text-slate-600 bg-blue-50/30">성능 향상률</td>
                  <td colspan="2" class="px-6 py-4 text-center font-bold text-blue-600 bg-blue-50/30">▲ ${proj.performance.improvement.toFixed(2)}%</td>
                </tr>
                <tr>
                  <td rowspan="6" class="px-6 py-4 border-r font-medium text-slate-700 bg-slate-50/50 text-center">비용(C)</td>

                <tr>
                  <td class="px-6 py-4 border-r text-slate-600">생애주기비용 (백만원)</td>

                </tr>
                <tr>
                  <td class="px-6 py-4 border-r text-slate-600 bg-emerald-50/30">절감액</td>
                  <td colspan="2" class="px-6 py-4 text-center font-bold text-emerald-600 bg-emerald-50/30">▽ ${formatNumber(proj.cost.lccSave)}</td>
                </tr>
                <tr>
                  <td class="px-6 py-4 border-r text-slate-600 bg-emerald-50/30">절감율</td>
                  <td colspan="2" class="px-6 py-4 text-center font-bold text-emerald-600 bg-emerald-50/30">▽ ${proj.cost.lccSaveRate.toFixed(2)}%</td>
                </tr>
                <tr>
                  <td rowspan="3" class="px-6 py-4 border-r font-medium text-slate-700 bg-slate-50/50 text-center">가치(V)</td>

                  <td class="px-6 py-4 text-right border-r font-medium">1.0000</td>

                </tr>
                <tr>
                  <td class="px-6 py-4 border-r text-slate-600">가치 지수</td>
                  <td class="px-6 py-4 text-right border-r font-medium">${formatNumber(proj.value.valueIndexBefore)}</td>

                </tr>
                <tr>
                  <td class="px-6 py-4 border-r text-slate-600 bg-blue-50/30">가치 향상률</td>
                  <td colspan="2" class="px-6 py-4 text-center font-bold text-blue-600 bg-blue-50/30">▲ ${proj.value.valueImprovement.toFixed(2)}%</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="mt-12 mb-6 flex items-center justify-between border-b border-slate-200 pb-4">
            <h3 class="text-xl font-bold text-slate-800">프로젝트 제안 채택 통계</h3>
            <span class="text-sm font-medium text-slate-500">해당 프로젝트에 등록된 아이디어 기준</span>
        </div>
        ${getChartsHTML()}
      `;
      
      const filteredIdeas = state.ideas.filter(i => i.projectId === proj.id || i.projectName === proj.name);
      setTimeout(() => { drawCharts(filteredIdeas); }, 50);
      
      return html;
    }

    // --- 업그레이드된 CSV 파싱 로직 ---
    window.handleCSVUpload = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          let text = e.target.result;
          
          // 1. 따옴표 안의 줄바꿈(\n, \r)을 임시 문자로 치환하여 행 분리 시 쪼개짐 방지
          text = text.replace(/"([^"]*)"/g, (match, p1) => '"' + p1.replace(/[\r\n]+/g, ' ') + '"');

          // 2. 행 별 분리 및 빈 줄 제거
          const lines = text.split(/[\r\n]+/).map(l => l.trim()).filter(Boolean);
          if (lines.length < 2) {
            showToast('데이터 행이 부족합니다.', 'error');
            return;
          }

          // CSV 셀 파싱 함수 (쉼표로 구분하되 큰따옴표 내부 처리)
          const parseCSVLine = (line) => {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
              const char = line[i];
              if (char === '"') {
                inQuotes = !inQuotes;
              } else if (char === ',' && !inQuotes) {
                result.push(current.trim().replace(/^"|"$/g, ''));
                current = '';
              } else {
                current += char;
              }
            }
            result.push(current.trim().replace(/^"|"$/g, ''));
            return result;
          };

          // 3. 첫 번째 행(헤더) 분석 및 인덱스 동적 감지
          const headerCols = parseCSVLine(lines[0]);
          const getIdx = (keywords) => headerCols.findIndex(h => keywords.some(k => h.includes(k)));

          const idxProject = getIdx(['프로젝트']);
          const idxCategory = getIdx(['구분']);
          const idxFacility = getIdx(['시설']);
          const idxTitle = getIdx(['제안', '제목', '아이디어']);
          const idxDiscipline = getIdx(['공종']);
          const idxInitial = getIdx(['초기']);
          const idxLcc = getIdx(['LCC', '생애']);
          const idxType = getIdx(['유형']);
          const idxAdopted = getIdx(['채택']);

          let newIdeasCount = 0;
          const parseNum = (val) => {
            if (!val) return 0;
            // ▽, ▲, 콤마 등 특수기호 정제 후 숫자 변환
            const clean = val.replace(/[^0-9.-]/g, '');
            return Number(clean) || 0;
          };

          for (let i = 1; i < lines.length; i++) {
            const cols = parseCSVLine(lines[i]);
            if (cols.length === 0 || cols.every(c => c === '')) continue;

            // 인덱스를 찾은 경우 해당 컬럼 사용, 없으면 순서대로 대체
            const projectName = (idxProject !== -1 ? cols[idxProject] : cols[0]) || '미지정';
            const category = (idxCategory !== -1 ? cols[idxCategory] : cols[1]) || '기본설계';
            const facility = (idxFacility !== -1 ? cols[idxFacility] : cols[2]) || '기타';
            const title = (idxTitle !== -1 ? cols[idxTitle] : cols[3]) || '제목 없음';
            const discipline = (idxDiscipline !== -1 ? cols[idxDiscipline] : cols[4]) || '기타';
            const initialSave = parseNum(idxInitial !== -1 ? cols[idxInitial] : cols[5]);
            const lccSave = parseNum(idxLcc !== -1 ? cols[idxLcc] : cols[6]);
            const type = (idxType !== -1 ? cols[idxType] : cols[7]) || '기타';
            const adoptVal = (idxAdopted !== -1 ? cols[idxAdopted] : cols[8]) || '';
            
            const isAdopted = adoptVal.includes('채택') || adoptVal.includes('O') || adoptVal.toUpperCase().includes('TRUE');

            state.ideas.unshift({
              id: Date.now() + i,
              projectId: 999,
              projectName,
              category,
              facility,
              title,
              discipline,
              initialSave,
              lccSave,
              type,
              isAdopted
            });
            newIdeasCount++;
          }

          if (newIdeasCount > 0) {
            showToast(`총 ${newIdeasCount}건의 아이디어가 성공적으로 업로드되었습니다.`);
            render(); 
          } else {
            showToast('올바른 CSV 데이터를 찾지 못했습니다.', 'error');
          }
        } catch (error) {
          console.error(error);
          showToast('파일을 읽는 중 오류가 발생했습니다.', 'error');
        }
        event.target.value = ''; 
      };
      reader.readAsText(file, 'utf-8'); 
    };

    function renderIdeas() {
      let trs = state.ideas.map(idea => `
        <tr class="hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-0">
          <td class="px-4 py-3 text-center">
            <span class="inline-flex items-center justify-center px-2.5 py-1 rounded-md text-xs font-bold ${idea.isAdopted ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-600'}">
              ${idea.isAdopted ? '채택' : '미채택'}
            </span>
          </td>
          <td class="px-4 py-3 font-medium text-slate-700 text-center">${idea.category}</td>
          <td class="px-4 py-3 font-medium text-emerald-700 bg-emerald-50/50 text-center">${idea.facility || '-'}</td>
          <td class="px-4 py-3 font-medium text-slate-700 text-center">${idea.discipline}</td>
          <td class="px-4 py-3 text-slate-500 text-center">${idea.type}</td>
          <td class="px-4 py-3 font-bold text-slate-800">${idea.title}</td>
          <td class="px-4 py-3 text-right font-medium text-emerald-600">${formatNumber(idea.initialSave)}</td>
          <td class="px-4 py-3 text-right font-medium text-emerald-600">${formatNumber(idea.lccSave)}</td>
          <td class="px-4 py-3 text-slate-500 truncate max-w-[150px]" title="${idea.projectName}">${idea.projectName}</td>
        </tr>
      `).join('');

      if(state.ideas.length === 0) {
        trs = `<tr><td colspan="9" class="px-6 py-12 text-center text-slate-500">등록된 아이디어가 없습니다.</td></tr>`;
      }

      return `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="p-5 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
            <h3 class="font-bold text-lg text-slate-800">아이디어 데이터베이스</h3>
            <label class="flex items-center gap-2 px-4 py-2.5 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 cursor-pointer transition-colors text-sm font-bold shadow-sm">
              <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
              CSV 일괄 업로드
              <input type="file" accept=".csv" class="hidden" onchange="handleCSVUpload(event)">
            </label>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
              <thead class="bg-white border-b border-slate-200 text-slate-500 bg-slate-50/50 whitespace-nowrap">
                <tr>
                  <th class="px-4 py-3 font-semibold text-center w-20">상태</th>
                  <th class="px-4 py-3 font-semibold text-center w-20">구분</th>
                  <th class="px-4 py-3 font-semibold text-center w-28 text-emerald-700">시설구분</th>
                  <th class="px-4 py-3 font-semibold text-center w-20">공종</th>
                  <th class="px-4 py-3 font-semibold text-center w-28">유형</th>
                  <th class="px-4 py-3 font-semibold min-w-[200px]">제안명 (아이디어 내용)</th>
                  <th class="px-4 py-3 font-semibold text-right w-32">초기비용절감</th>
                  <th class="px-4 py-3 font-semibold text-right w-32">LCC절감</th>
                  <th class="px-4 py-3 font-semibold w-48">프로젝트명</th>
                </tr>
              </thead>
              <tbody>${trs}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function render() {
      const tabs = [
        { id: 'overall', label: '전체 통계', icon: 'layout-dashboard' },
        { id: 'projects', label: '프로젝트 관리', icon: 'folder-kanban' },
        { id: 'ideas', label: '아이디어 DB', icon: 'lightbulb' }
      ];
      
      const navHtml = tabs.map(tab => {
        const isActive = state.activeTab === tab.id || (state.activeTab === 'project-detail' && tab.id === 'projects');
        const activeClass = isActive ? 'bg-indigo-50 text-indigo-700 shadow-sm' : 'text-slate-500 hover:bg-slate-100';
        return `
          <button onclick="switchTab('${tab.id}')" class="flex items-center gap-2 px-5 py-2 rounded-lg font-medium transition-all ${activeClass}">
            <i data-lucide="${tab.icon}" class="w-5 h-5"></i>
            ${tab.label}
          </button>
        `;
      }).join('');
      document.getElementById('nav-tabs').innerHTML = navHtml;

      destroyCharts();
      
      const main = document.getElementById('main-content');
      if (state.activeTab === 'overall') {
        main.innerHTML = renderOverall();
      } else if (state.activeTab === 'projects') {
        main.innerHTML = renderProjects();
      } else if (state.activeTab === 'project-detail') {
        main.innerHTML = renderProjectDetail();
      } else if (state.activeTab === 'ideas') {
        main.innerHTML = renderIdeas();
      }

      lucide.createIcons();
    }

    window.onload = () => render();
  </script>
</body>
