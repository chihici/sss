<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VE Project 통합관리 대시보드</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PapaParse (강력한 CSV 파싱 엔진) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    body { background-color: #f8fafc; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* Toast Animation */
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    .toast-enter { animation: slideInRight 0.3s ease-out forwards; }
    .toast-exit { animation: fadeOut 0.3s ease-out forwards; }
  </style>
</head>
<body class="text-slate-800">

  <!-- Toast 알림 컨테이너 -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

  <!-- 모달 컨테이너 -->
  <div id="modal-container"></div>

  <div class="min-h-screen pb-12">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
      <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2 text-indigo-700">
          <i data-lucide="layout-dashboard" class="stroke-[2.5]"></i>
          <h1 class="text-xl font-bold tracking-tight">VE Project 관리</h1>
        </div>
        <nav class="flex gap-2" id="nav-tabs"></nav>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="max-w-7xl mx-auto px-6 py-8"></main>
  </div>

  <script>
    // --- 초기 데이터 ---
    const initialProjects = [
      {
        id: 1, year: 2025, name: 'A-1 공구 도로건설공사 설계VE', client: '한국도로공사', period: '2025.01 ~ 2025.06', pm: '김수석', status: '완료',
        performance: { indexBefore: 500.00, indexAfter: 598.71 },
        cost: { initialBefore: 77000.00, lccBefore: 134622.32 }
      },
      {
        id: 2, year: 2024, name: 'B-지구 택지개발 조성공사 설계VE', client: 'LH 한국토지주택공사', period: '2024.03 ~ 2024.09', pm: '이책임', status: '진행중',
        performance: { indexBefore: 450, indexAfter: 520 },
        cost: { initialBefore: 50000, lccBefore: 80000 }
      }
    ];

    const initialIdeas = [
      { id: 1, projectId: 1, projectName: 'A-1 공구 도로건설공사 설계VE', category: '설계', facility: '기반시설', title: '외장재 변경을 통한 공사비 절감 및 미관 개선', discipline: '건축', initialSave: 50, lccSave: 80, type: '가치혁신형', isAdopted: true },
      { id: 2, projectId: 1, projectName: 'A-1 공구 도로건설공사 설계VE', category: '설계', facility: '기반시설', title: '흙막이 가시설 공법 변경', discipline: '토목', initialSave: 100, lccSave: 100, type: '비용절감형', isAdopted: true },
      { id: 3, projectId: 1, projectName: 'A-1 공구 도로건설공사 설계VE', category: '설계', facility: '기반시설', title: '고효율 펌프 도입', discipline: '기계', initialSave: -10, lccSave: 50, type: '성능강조형', isAdopted: false },
      { id: 4, projectId: 2, projectName: 'B-지구 택지개발 조성공사 설계VE', category: '실시', facility: '주거시설', title: 'LED 조명 디밍 시스템 적용', discipline: '전기', initialSave: 20, lccSave: 120, type: '성능향상형', isAdopted: true },
      { id: 5, projectId: 2, projectName: 'B-지구 택지개발 조성공사 설계VE', category: '실시', facility: '주거시설', title: '수목 규격 조정', discipline: '조경', initialSave: 30, lccSave: 30, type: '비용절감형', isAdopted: false },
    ];

    // --- State ---
    const state = {
      activeTab: 'overall', 
      projects: [...initialProjects],
      ideas: [...initialIdeas],
      selectedProjectId: null,
      projectSortBy: 'latest',
      searchIdeaQuery: '', // 아이디어 검색어
      overallFilters: {
        category: '전체', facility: '전체', discipline: '전체', type: '전체', isAdopted: '전체'
      },
      chartInstances: {} 
    };

    const COLORS = {
      adopted: '#3b82f6', unadopted: '#f59e0b',
      types: ['#6366f1', '#10b981', '#f43f5e', '#eab308', '#0ea5e9', '#d946ef']
    };

    // --- 유틸리티 함수 ---
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const bgColor = type === 'error' ? 'bg-rose-500' : 'bg-slate-800';
      toast.className = `toast-enter flex items-center gap-3 px-5 py-3 ${bgColor} text-white rounded-xl shadow-lg font-medium text-sm`;
      
      const icon = type === 'error' ? 'circle-x' : 'check-circle-2';
      toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i><span>${message}</span>`;
      
      container.appendChild(toast);
      lucide.createIcons({ root: toast });

      setTimeout(() => {
        toast.classList.replace('toast-enter', 'toast-exit');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function formatNumber(num) {
      if (isNaN(num)) return '0';
      return Number(num).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    // 프로젝트 가치 지표 동적 계산 함수 (아이디어 DB 연동)
    function getProjectStats(proj) {
      const linkedIdeas = state.ideas.filter(i => i.projectId === proj.id && i.isAdopted);
      const initialSave = linkedIdeas.reduce((sum, i) => sum + i.initialSave, 0);
      const lccSave = linkedIdeas.reduce((sum, i) => sum + i.lccSave, 0);

      const initialBefore = proj.cost.initialBefore || 0;
      const initialAfter = initialBefore - initialSave;
      const initialSaveRate = initialBefore ? (initialSave / initialBefore) * 100 : 0;

      const lccBefore = proj.cost.lccBefore || 0;
      const lccAfter = lccBefore - lccSave;
      const lccSaveRate = lccBefore ? (lccSave / lccBefore) * 100 : 0;

      const indexBefore = proj.performance.indexBefore || 100;
      const indexAfter = proj.performance.indexAfter || indexBefore;
      const improvement = indexBefore ? ((indexAfter - indexBefore) / indexBefore) * 100 : 0;

      const relativeLcc = lccBefore ? (lccAfter / lccBefore) : 1;
      const valueIndexBefore = indexBefore; // 단순화
      const valueIndexAfter = relativeLcc > 0 ? (indexAfter / relativeLcc) : indexAfter;
      const valueImprovement = valueIndexBefore ? ((valueIndexAfter - valueIndexBefore) / valueIndexBefore) * 100 : 0;

      return {
        initialSave, initialAfter, initialSaveRate,
        lccSave, lccAfter, lccSaveRate,
        indexBefore, indexAfter, improvement,
        relativeLcc, valueIndexBefore, valueIndexAfter, valueImprovement
      };
    }

    // --- 이벤트 핸들러 ---
    window.switchTab = function(tabId) {
      state.activeTab = tabId;
      if (tabId !== 'project-detail') state.selectedProjectId = null;
      render();
    }

    window.selectProject = function(id) {
      state.selectedProjectId = id;
      state.activeTab = 'project-detail';
      render();
    }

    window.updateProjectSort = (val) => { state.projectSortBy = val; render(); }
    window.updateOverallFilter = (key, val) => { state.overallFilters[key] = val; render(); }
    
    // 아이디어 검색 (포커스 유지를 위해 표 내용만 리렌더링)
    window.handleIdeaSearch = function(val) {
      state.searchQuery = val;
      const tbody = document.getElementById('idea-tbody');
      if (tbody) {
        tbody.innerHTML = getIdeaTableRowsHTML();
        lucide.createIcons();
      }
    }

    // 프로젝트 삭제 기능
    window.deleteProject = function(event, id) {
      event.stopPropagation(); // 카드 클릭(상세이동) 방지
      if (confirm('정말 이 프로젝트를 삭제하시겠습니까?\n(해당 프로젝트의 아이디어 데이터도 모두 삭제됩니다.)')) {
        state.projects = state.projects.filter(p => p.id !== id);
        state.ideas = state.ideas.filter(i => i.projectId !== id);
        render();
        showToast('프로젝트와 관련 아이디어가 모두 삭제되었습니다.');
      }
    };

    // 아이디어 삭제 기능
    window.deleteIdea = function(id) {
      if (confirm('정말 이 아이디어를 삭제하시겠습니까? (삭제 시 프로젝트 절감액에서 제외됩니다)')) {
        state.ideas = state.ideas.filter(i => i.id !== id);
        // 아이디어 테이블만 업데이트
        const tbody = document.getElementById('idea-tbody');
        if(tbody) {
            tbody.innerHTML = getIdeaTableRowsHTML();
            lucide.createIcons();
        } else {
            render();
        }
        showToast('성공적으로 삭제되었습니다.');
      }
    };

    // --- 차트 렌더링 ---
    function destroyCharts() {
      for (const key in state.chartInstances) {
        if (state.chartInstances[key]) state.chartInstances[key].destroy();
      }
      state.chartInstances = {};
    }

    function drawCharts(targetIdeas) {
      if (targetIdeas.length === 0) return;
      const disciplineData = {};
      const typeData = {};
      let totalAdopted = 0, totalUnadopted = 0;

      targetIdeas.forEach(idea => {
        if (!disciplineData[idea.discipline]) disciplineData[idea.discipline] = { adopted: 0, unadopted: 0 };
        if (idea.isAdopted) {
          disciplineData[idea.discipline].adopted++;
          totalAdopted++;
          typeData[idea.type] = (typeData[idea.type] || 0) + 1;
        } else {
          disciplineData[idea.discipline].unadopted++;
          totalUnadopted++;
        }
      });

      const labels = Object.keys(disciplineData);
      const adoptedData = labels.map(l => disciplineData[l].adopted);
      const unadoptedData = labels.map(l => disciplineData[l].unadopted);
      const typeLabels = Object.keys(typeData);
      const typeValues = Object.values(typeData);

      const commonOptions = { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } };

      state.chartInstances['c1'] = new Chart(document.getElementById('chart-discipline-compare').getContext('2d'), {
        type: 'bar', data: { labels, datasets: [{ label: '채택', data: adoptedData, backgroundColor: COLORS.adopted, borderRadius: 4 }, { label: '미채택', data: unadoptedData, backgroundColor: COLORS.unadopted, borderRadius: 4 }]}, options: { ...commonOptions, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
      });
      state.chartInstances['c2'] = new Chart(document.getElementById('chart-adoption-rate').getContext('2d'), {
        type: 'pie', data: { labels: ['채택', '미채택'], datasets: [{ data: [totalAdopted, totalUnadopted], backgroundColor: [COLORS.adopted, COLORS.unadopted], borderWidth: 2 }] }, options: commonOptions
      });
      state.chartInstances['c3'] = new Chart(document.getElementById('chart-discipline-adopted').getContext('2d'), {
        type: 'bar', data: { labels, datasets: [{ label: '채택 건수', data: adoptedData, backgroundColor: COLORS.adopted, borderRadius: 4 }] }, options: { ...commonOptions, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { legend: { display: false } } }
      });
      state.chartInstances['c4'] = new Chart(document.getElementById('chart-type-rate').getContext('2d'), {
        type: 'pie', data: { labels: typeLabels.length ? typeLabels : ['데이터 없음'], datasets: [{ data: typeValues.length ? typeValues : [1], backgroundColor: typeValues.length ? COLORS.types : ['#cbd5e1'], borderWidth: 2 }] }, options: commonOptions
      });
    }

    function getChartsHTML() {
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><h3 class="font-bold text-slate-800 mb-6 text-center">공종별 채택/미채택 비교</h3><div class="h-64 relative"><canvas id="chart-discipline-compare"></canvas></div></div>
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><h3 class="font-bold text-slate-800 mb-6 text-center">제안 채택률</h3><div class="h-64 relative"><canvas id="chart-adoption-rate"></canvas></div></div>
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><h3 class="font-bold text-slate-800 mb-6 text-center">공종별 채택 제안 개수</h3><div class="h-64 relative"><canvas id="chart-discipline-adopted"></canvas></div></div>
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><h3 class="font-bold text-slate-800 mb-6 text-center">유형별 채택 비율 (채택건 기준)</h3><div class="h-64 relative"><canvas id="chart-type-rate"></canvas></div></div>
        </div>
      `;
    }

    // --- 각 탭 렌더링 ---
    function renderOverall() {
      const f = state.overallFilters;
      const filteredIdeas = state.ideas.filter(idea => {
        const matchCat = f.category === '전체' || idea.category === f.category;
        const matchFac = f.facility === '전체' || idea.facility === f.facility;
        const matchDis = f.discipline === '전체' || idea.discipline === f.discipline;
        const matchType = f.type === '전체' || idea.type === f.type;
        const adoptedStr = idea.isAdopted ? '채택' : '미채택';
        const matchAdopt = f.isAdopted === '전체' || adoptedStr === f.isAdopted;
        return matchCat && matchFac && matchDis && matchType && matchAdopt;
      });

      const totalInitialSave = filteredIdeas.reduce((sum, i) => sum + (Number(i.initialSave) || 0), 0);
      const totalLccSave = filteredIdeas.reduce((sum, i) => sum + (Number(i.lccSave) || 0), 0);
      const uniqueProjectsCount = new Set(filteredIdeas.map(i => i.projectId)).size;

      const makeSelect = (key, options, label) => `
        <div class="flex flex-col gap-1 w-full sm:w-auto">
          <label class="text-xs font-semibold text-slate-500 pl-1">${label}</label>
          <select onchange="updateOverallFilter('${key}', this.value)" class="bg-slate-50 border border-slate-200 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer min-w-[120px]">
            ${options.map(o => `<option value="${o}" ${state.overallFilters[key] === o ? 'selected' : ''}>${o}</option>`).join('')}
          </select>
        </div>
      `;

      let html = `
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-x-6 gap-y-4 items-end">
          <div class="flex items-center gap-2 mr-2 text-indigo-700 w-full sm:w-auto mb-2 sm:mb-0"><i data-lucide="filter" class="w-5 h-5"></i><span class="font-bold whitespace-nowrap">통계 필터링</span></div>
          ${makeSelect('category', ['전체', '기본설계', '실시설계', '실시', '설계', '시공'], '구분')}
          ${makeSelect('facility', ['전체', '의료시설', '운수시설', '문화 및 집회시설', '업무시설', '상업시설', '주거시설', '교육연구시설', '기반시설', '물류시설', '기타'], '시설구분')}
          ${makeSelect('discipline', ['전체', '건축', '토목', '기계', '전기', '통신', '소방', '조경'], '공종')}
          ${makeSelect('type', ['전체', '가치혁신형', '비용절감형', '성능강조형', '성능향상형'], '유형')}
          ${makeSelect('isAdopted', ['전체', '채택', '미채택'], '채택여부')}
        </div>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><p class="text-sm font-medium text-slate-500 mb-1">관련 프로젝트 수</p><p class="text-3xl font-bold text-slate-800">${uniqueProjectsCount}건</p></div>
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><p class="text-sm font-medium text-slate-500 mb-1">초기비용 절감액 합계</p><p class="text-3xl font-bold text-emerald-600">${formatNumber(totalInitialSave)} <span class="text-base text-emerald-500/80">백만원</span></p></div>
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><p class="text-sm font-medium text-slate-500 mb-1">LCC 절감액 합계</p><p class="text-3xl font-bold text-emerald-600">${formatNumber(totalLccSave)} <span class="text-base text-emerald-500/80">백만원</span></p></div>
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><p class="text-sm font-medium text-slate-500 mb-1">필터링된 아이디어</p><p class="text-3xl font-bold text-indigo-600">${filteredIdeas.length}건</p></div>
        </div>
        ${getChartsHTML()}
      `;
      setTimeout(() => { drawCharts(filteredIdeas); }, 50);
      return html;
    }

    function renderProjects() {
      let sortedProjects = [...state.projects];
      if (state.projectSortBy === 'latest') sortedProjects.sort((a, b) => b.year - a.year);
      else if (state.projectSortBy === 'oldest') sortedProjects.sort((a, b) => a.year - b.year);
      else if (state.projectSortBy === 'name') sortedProjects.sort((a, b) => a.name.localeCompare(b.name));

      let cards = sortedProjects.map(proj => {
        const stats = getProjectStats(proj); // 동적 계산
        return `
        <div onclick="selectProject(${proj.id})" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md hover:border-indigo-300 transition-all cursor-pointer group relative">
          <div class="absolute top-6 right-6 flex items-center gap-2">
            <span class="bg-slate-100 text-slate-600 text-sm font-bold px-3 py-1 rounded-full border border-slate-200 shadow-sm">${proj.year}년</span>
            <button onclick="deleteProject(event, ${proj.id})" class="text-rose-400 hover:text-rose-600 hover:bg-rose-50 p-1.5 rounded-lg transition-colors opacity-0 md:group-hover:opacity-100" title="프로젝트 삭제">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="flex justify-between items-start mb-4 pr-24">
            <div>
              <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-full mb-3">${proj.status}</span>
              <h3 class="text-xl font-bold text-slate-800 group-hover:text-indigo-600 transition-colors">${proj.name}</h3>
              <p class="text-slate-500 text-sm mt-1">${proj.client || '발주처 미상'}</p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 mt-6 pt-6 border-t border-slate-100">
            <div><p class="text-xs text-slate-400 mb-1">LCC 절감액</p><p class="font-bold text-emerald-600">${formatNumber(stats.lccSave)} 백만원</p></div>
            <div><p class="text-xs text-slate-400 mb-1">가치 향상률</p><p class="font-bold text-blue-600">▲ ${stats.valueImprovement.toFixed(2)}%</p></div>
          </div>
        </div>
      `}).join('');

      return `
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-slate-800">프로젝트 목록</h2>
          <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
            <i data-lucide="arrow-up-down" class="w-4 h-4 text-slate-500"></i>
            <select onchange="updateProjectSort(this.value)" class="text-sm font-medium text-slate-700 bg-transparent outline-none focus:ring-0 cursor-pointer">
              <option value="latest" ${state.projectSortBy === 'latest' ? 'selected' : ''}>최신 연도순</option>
              <option value="oldest" ${state.projectSortBy === 'oldest' ? 'selected' : ''}>과거 연도순</option>
              <option value="name" ${state.projectSortBy === 'name' ? 'selected' : ''}>가나다순</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">${cards}</div>
      `;
    }

    function renderProjectDetail() {
      const proj = state.projects.find(p => p.id === state.selectedProjectId);
      if(!proj) return '';

      const stats = getProjectStats(proj); // 동적 계산 적용

      let html = `
        <div class="flex items-center justify-between mb-8">
          <div>

    // --- 프로젝트 자동 매핑 유틸리티 ---
    function getOrCreateProject(projectName) {
      const name = (projectName || '미지정').trim();
      let proj = state.projects.find(p => p.name === name);
      if (!proj) {
        proj = {
          id: Date.now() + Math.random(),
          year: new Date().getFullYear(),
          name: name,
          client: '',
          period: '',
          pm: '',
          status: '진행중',
          performance: { indexBefore: 100, indexAfter: 100 },
          cost: { initialBefore: 0, lccBefore: 0 }
        };
        state.projects.push(proj);
      }
      return proj.id;
    }

    // --- 강력한 CSV 파일 업로드 파싱 (PapaParse) ---
    window.handleCSVUpload = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      // 엑셀 원본 차단 안전장치
      if (file.name.endsWith('.xls') || file.name.endsWith('.xlsx')) {
        showToast('엑셀 파일(.xlsx)은 직접 올릴 수 없습니다. 엑셀에서 [다른 이름으로 저장] -> [CSV] 로 저장한 뒤 그 파일을 올려주세요!', 'error');
        event.target.value = '';
        return;
      }

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        encoding: "EUC-KR", // 한글 깨짐 방지용 기본 인코딩
        complete: function(results) {
          try {
            const data = results.data;
            if (data.length === 0) {
              showToast('데이터가 비어 있습니다.', 'error');
              return;
            }

            // 헤더 자동 매칭 
            const headers = Object.keys(data[0]);
            const getCol = (keywords) => headers.find(h => keywords.some(k => h.includes(k)));

            const colProject = getCol(['프로젝트']);
            const colCategory = getCol(['구분']);
            const colFacility = getCol(['시설']);
            const colTitle = getCol(['제안', '제목', '아이디어']);
            const colDiscipline = getCol(['공종']);
            const colInitial = getCol(['초기']);
            const colLcc = getCol(['LCC', '생애']);
            const colType = getCol(['유형']);
            const colAdopted = getCol(['채택']);

            let newIdeasCount = 0;
            const parseNum = (val) => Number((String(val) || '').replace(/[^0-9.-]/g, '')) || 0;

            for (let row of data) {
              if (!row[colTitle] && !row[colProject]) continue; // 빈 줄 무시

              const adoptVal = String(row[colAdopted] || '').trim();
              let isAdopted = false;
              // 미채택/부정어 우선 필터링
              if (adoptVal.includes('미채택') || adoptVal.includes('불채택') || adoptVal.includes('X') || adoptVal.toUpperCase() === 'FALSE') {
                isAdopted = false;
              } else if (adoptVal.includes('채택') || adoptVal.includes('O') || adoptVal.toUpperCase() === 'TRUE') {
                isAdopted = true;
              }

              const projectName = String(row[colProject] || '미지정').trim();
              const projectId = getOrCreateProject(projectName); // 🚀 프로젝트 자동 생성 연계

              state.ideas.unshift({
                id: Date.now() + Math.random(),
                projectId: projectId,
                projectName: projectName,
                category: String(row[colCategory] || '기본설계').trim(),
                facility: String(row[colFacility] || '기타').trim(),
                title: String(row[colTitle] || '제목 없음').trim(),
                discipline: String(row[colDiscipline] || '기타').trim(),
                initialSave: parseNum(row[colInitial]),
                lccSave: parseNum(row[colLcc]),
                type: String(row[colType] || '기타').trim(),
                isAdopted: isAdopted
              });
              newIdeasCount++;
            }

            if (newIdeasCount > 0) {
              showToast(`총 ${newIdeasCount}건의 아이디어가 성공적으로 업로드되었습니다.`);
              render(); 
            } else {
              showToast('올바른 데이터를 찾지 못했습니다. 헤더를 확인해주세요.', 'error');
            }
          } catch (e) {
            console.error(e);
            showToast('데이터 처리 중 오류가 발생했습니다.', 'error');
          }
          event.target.value = '';
        },
        error: function(error) {
          console.error(error);
          showToast('CSV 파일을 읽는 데 실패했습니다.', 'error');
          event.target.value = '';
        }
      });
    };

    window.saveProject = function(event, id) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const projIndex = state.projects.findIndex(p => p.id === id);
      if (projIndex > -1) {
        state.projects[projIndex].name = fd.get('name');
        state.projects[projIndex].status = fd.get('status');
        state.projects[projIndex].year = Number(fd.get('year'));
        state.projects[projIndex].cost.initialBefore = Number(fd.get('initialBefore'));
        state.projects[projIndex].cost.lccBefore = Number(fd.get('lccBefore'));
        state.projects[projIndex].performance.indexBefore = Number(fd.get('indexBefore'));
        state.projects[projIndex].performance.indexAfter = Number(fd.get('indexAfter'));
        
        // 아이디어 테이블의 projectName 도 동기화
        state.ideas.forEach(i => { if(i.projectId === id) i.projectName = fd.get('name'); });
        
        closeModal();
        showToast('프로젝트 정보가 업데이트 되었습니다.');
        render();
      }
    }

                <div class="col-span-2">
                  <label class="block text-sm font-medium text-slate-700 mb-1">프로젝트명</label>
                  <input type="text" name="projectName" placeholder="기존 프로젝트명 선택 또는 새 이름 입력" list="project-list" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                  <datalist id="project-list">${projectOptions}</datalist>
                </div>
                <div><label class="block text-sm font-medium text-slate-700 mb-1">구분</label><select name="category" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none"><option>기본설계</option><option>실시설계</option><option>시공</option></select></div>
                <div><label class="block text-sm font-medium text-slate-700 mb-1">시설구분</label><select name="facility" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none"><option>의료시설</option><option>주거시설</option><option>기반시설</option><option>기타</option></select></div>
                <div><label class="block text-sm font-medium text-slate-700 mb-1">공종</label><select name="discipline" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none"><option>건축</option><option>토목</option><option>기계</option><option>전기</option><option>조경</option></select></div>
                <div><label class="block text-sm font-medium text-slate-700 mb-1">유형</label><select name="type" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none"><option>가치혁신형</option><option>비용절감형</option><option>성능향상형</option></select></div>
                <div class="col-span-2"><label class="block text-sm font-medium text-slate-700 mb-1">제안명 (아이디어 내용)</label><input type="text" name="title" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none"></div>
                <div><label class="block text-sm font-medium text-slate-700 mb-1">초기비용절감액</label><input type="number" step="any" name="initialSave" value="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none"></div>
                <div><label class="block text-sm font-medium text-slate-700 mb-1">LCC절감액</label><input type="number" step="any" name="lccSave" value="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none"></div>
                <div class="col-span-2"><label class="block text-sm font-medium text-slate-700 mb-1">채택여부</label><select name="isAdopted" class="w-full px-3 py-2 border border-slate-300 rounded-lg"><option value="true">채택</option><option value="false">미채택</option></select></div>
              </div>
              <div class="flex justify-end gap-2 pt-4 border-t border-slate-200">
                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 font-medium">취소</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium shadow-sm">추가하기</button>
              </div>
            </form>
          </div>
        </div>
      `;
    };

    window.saveIdea = function(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const projectName = fd.get('projectName');
      const projectId = getOrCreateProject(projectName); // 자동 연결

      state.ideas.unshift({
        id: Date.now(),
        projectId: projectId,
        projectName: projectName,
        category: fd.get('category'),
        facility: fd.get('facility'),
        discipline: fd.get('discipline'),
        type: fd.get('type'),
        title: fd.get('title'),
        initialSave: Number(fd.get('initialSave')) || 0,
        lccSave: Number(fd.get('lccSave')) || 0,
        isAdopted: fd.get('isAdopted') === 'true'
      });
      closeModal();
      showToast('새 아이디어가 성공적으로 등록되었습니다.');
      render();
    };

    // --- 메인 렌더 함수 ---
    function render() {
      const tabs = [
        { id: 'overall', label: '전체 통계', icon: 'layout-dashboard' },
        { id: 'projects', label: '프로젝트 관리', icon: 'folder-kanban' },
        { id: 'ideas', label: '아이디어 DB', icon: 'lightbulb' }
      ];
      
      const navHtml = tabs.map(tab => {
        const isActive = state.activeTab === tab.id || (state.activeTab === 'project-detail' && tab.id === 'projects');
        const activeClass = isActive ? 'bg-indigo-50 text-indigo-700 shadow-sm' : 'text-slate-500 hover:bg-slate-100';
        return `<button onclick="switchTab('${tab.id}')" class="flex items-center gap-2 px-5 py-2 rounded-lg font-medium transition-all ${activeClass}"><i data-lucide="${tab.icon}" class="w-5 h-5"></i>${tab.label}</button>`;
      }).join('');
      document.getElementById('nav-tabs').innerHTML = navHtml;

      destroyCharts();
      
      const main = document.getElementById('main-content');
      if (state.activeTab === 'overall') main.innerHTML = renderOverall();
      else if (state.activeTab === 'projects') main.innerHTML = renderProjects();
      else if (state.activeTab === 'project-detail') main.innerHTML = renderProjectDetail();
      else if (state.activeTab === 'ideas') {
        main.innerHTML = renderIdeas();
        // 렌더 직후 포커스 유지를 위해 입력값 갱신
        const searchInput = document.querySelector('input[oninput="handleIdeaSearch(this.value)"]');
        if (searchInput && state.searchQuery) searchInput.value = state.searchQuery;
      }

      lucide.createIcons();
    }

    // 초기 실행
    window.onload = () => render();
  </script>
</body>
</html>
